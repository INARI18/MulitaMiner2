<svg xmlns='http://www.w3.org/2000/svg' width='1320' height='685' viewBox='0 0 1320 685'><rect width='1320' height='685' fill='#fbf6ef'/>
<text x='40' y='60' font-size='26' fill='#e0572a' font-weight='bold' text-anchor='start' letter-spacing='5' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' dominant-baseline='middle'>PRIORITIZATION</text>
<text x='40' y='90' font-size='13.5' fill='#6e655b' font-weight='normal' text-anchor='start' font-family='Helvetica,ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif' dominant-baseline='middle'>Add up one point value from each card below, then read the total on the scale: that is the finding&#39;s remediation</text>
<text x='40' y='109' font-size='13.5' fill='#6e655b' font-weight='normal' text-anchor='start' font-family='Helvetica,ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif' dominant-baseline='middle'>category.</text>
<text x='1280' y='104' font-size='11.5' fill='#9b8e7d' font-weight='normal' text-anchor='end' letter-spacing='1.1' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' dominant-baseline='middle'>CATEGORIES</text>
<text x='1280' y='82' font-size='15' fill='#2c2a27' font-weight='bold' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' dominant-baseline='middle'>4</text>
<text x='1170' y='104' font-size='11.5' fill='#9b8e7d' font-weight='normal' text-anchor='end' letter-spacing='1.1' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' dominant-baseline='middle'>SIGNALS</text>
<text x='1170' y='82' font-size='15' fill='#2c2a27' font-weight='bold' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' dominant-baseline='middle'>3</text>
