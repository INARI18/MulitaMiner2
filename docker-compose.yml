# Serves the fine-tuned v4 model with Ollama and runs the mulitaminer CLI
# against it, with nothing installed on the host but Docker.
#
#   docker compose run --rm mulita <any mulitaminer command>
#   docker compose run --rm mulita extract resources/openvas/OpenVAS_JuiceShop.pdf --model mulita-qwen2.5-1.5b-v4
#
# Ollama runs on the CPU unless the container is handed an NVIDIA GPU; Compose
# cannot do that conditionally, so docker-compose.gpu.yml adds it:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml run --rm mulita ...
#
# Cloud models need their key in .env (gitignored; delete when done).
#
# The model comes from Hugging Face at a pinned commit (tools/fetch_model.py)
# and is registered with its Modelfile: the GGUF alone silently empties the
# structured fields.

services:
  ollama:
    # Pinned: changing the Ollama version moves the scores (Mulita-Training
    # TRAINING.md 6h), so compare numbers only within the same tag.
    image: ollama/ollama:0.34.0
    volumes:
      - ollama:/root/.ollama
    # No host port: the other services share this netns, and a host Ollama
    # usually holds 11434 already.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  model-fetch:
    image: python:3.11-slim
    volumes:
      - ./tools/fetch_model.py:/fetch_model.py:ro
      - model:/model
    command: ["python", "/fetch_model.py", "/model"]

  model-register:
    image: ollama/ollama:0.34.0
    depends_on:
      ollama:
        condition: service_healthy
      model-fetch:
        condition: service_completed_successfully
    network_mode: "service:ollama"   # the CLI talks to the server on localhost:11434
    volumes:
      - model:/model:ro
    entrypoint: ["ollama", "create", "mulita-qwen2.5-1.5b-v4", "-f", "/model/Modelfile"]

  mulita:
    # The CLI. No default command: `docker compose run --rm mulita <command>`,
    # which also brings up ollama and registers the model first.
    build:
      context: .
      args:
        INSTALL_EVAL: "${INSTALL_EVAL:-false}"
    depends_on:
      model-register:
        condition: service_completed_successfully
    network_mode: "service:ollama"   # the profile's localhost:11434 reaches Ollama
    # Passes every API key in .env (cloud models only); a local-only run needs none.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./resources:/app/resources   # input PDFs (+ baseline xlsx)
      - ./outputs:/app/outputs       # run artifacts, same place as a local install

volumes:
  ollama:
  model:
