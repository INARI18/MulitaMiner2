# Runs the experiment against the fine-tuned v4 model (local, GPU via Ollama)
# and optionally DeepSeek (API). Needs the NVIDIA Container Toolkit.
#
#   docker compose up --build        # fetch + register v4, then run the experiment
#   # results land in ./output_docker
#
# Override the run: MODELS=mulita-qwen2.5-1.5b-v4,deepseek RUNS=5 docker compose up --build
# deepseek also needs DEEPSEEK_API_KEY in .env (gitignored; delete when done).
#
# The model comes from Hugging Face at a pinned commit (tools/fetch_model.py)
# and is registered with its Modelfile: the GGUF alone silently empties the
# structured fields.

services:
  ollama:
    # Pinned: changing the Ollama version moves the scores (Mulita-Training
    # TRAINING.md 6h), so compare numbers only within the same tag.
    image: ollama/ollama:0.34.0
    volumes:
      - ollama:/root/.ollama
    # No host port: the other services share this netns, and a host Ollama
    # usually holds 11434 already.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  model-fetch:
    image: python:3.11-slim
    volumes:
      - ./tools/fetch_model.py:/fetch_model.py:ro
      - model:/model
    command: ["python", "/fetch_model.py", "/model"]

  model-register:
    image: ollama/ollama:0.34.0
    depends_on:
      ollama:
        condition: service_healthy
      model-fetch:
        condition: service_completed_successfully
    network_mode: "service:ollama"   # the CLI talks to the server on localhost:11434
    volumes:
      - model:/model:ro
    entrypoint: ["ollama", "create", "mulita-qwen2.5-1.5b-v4", "-f", "/model/Modelfile"]

  mulita:
    build:
      context: .
      args:
        INSTALL_EVAL: "${INSTALL_EVAL:-false}"
    depends_on:
      model-register:
        condition: service_completed_successfully
    network_mode: "service:ollama"   # the profile's localhost:11434 reaches Ollama
    environment:
      # Optional: only needed when 'deepseek' is in MODELS.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ./resources:/app/resources               # input PDFs (+ baseline xlsx)
      # Own folder: each experiment rewrites the folder's experiment.json.
      - ./output_docker:/app/output_experiments
    command: >
      experiment ${REPORTS:-resources}
      --models ${MODELS:-mulita-qwen2.5-1.5b-v4}
      --runs ${RUNS:-3}
      --metrics ${METRICS:-all}

volumes:
  ollama:
  model:
